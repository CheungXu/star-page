# Nginx 站点配置模板（与服务器 /etc/nginx/sites-available/star-page 保持同步）
# 共享 location 片段：/etc/nginx/snippets/star-page-locations.conf

# 后端两个 web 实例（star-page-web@8000 / @8001）。连接被拒或超时的那个 5 秒内不再分请求，
# 逐个重启时不中断。生成在单独的 worker 进程里跑，不经过这里。
upstream star_page_api {
    server 127.0.0.1:8000 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8001 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8002 max_fails=1 fail_timeout=5s;
    keepalive 16;
}

# 埋点接口按客户端 IP 限流，片段里的 /api/analytics/collect 使用。
limit_req_zone $binary_remote_addr zone=sp_analytics:10m rate=2r/s;

# 本机内部入口：Next.js 服务端取数（BACKEND_INTERNAL_URL）走这里，同样在两个 web 实例之间转发。
server {
    listen 127.0.0.1:8080;
    server_name _;
    client_max_body_size 60m;

    location / {
        proxy_pass http://star_page_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 420s;
    }
}

# HTTP：域名统一跳转到 https://stars-page.com
server {
    listen 80;
    listen [::]:80;
    server_name stars-page.com www.stars-page.com;
    return 301 https://stars-page.com$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 60m;
    include snippets/star-page-locations.conf;
}

# HTTPS：www 统一跳转到根域
# 开 HTTP/2：多模型生成和预览会同时开很多请求，HTTP/1.1 下浏览器同源只给 6 条连接。
# nginx 1.24 用 listen ... http2 的写法；升级到 1.25.1 以上可改成 http2 on。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.stars-page.com;
    client_max_body_size 60m;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cert.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://stars-page.com$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name stars-page.com;
    client_max_body_size 60m;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cert.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include snippets/star-page-locations.conf;
}
