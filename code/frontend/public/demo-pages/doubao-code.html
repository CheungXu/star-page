<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';

// ============ 场景初始化 ============
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000008, 0.025);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 0, 28);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// ============ 后期处理 ============
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.9,  // strength
  0.6,  // radius
  0.0   // threshold
);
composer.addPass(bloomPass);

const fxaaPass = new ShaderPass(FXAAShader);
fxaaPass.uniforms['resolution'].value.set(1 / window.innerWidth, 1 / window.innerHeight);
composer.addPass(fxaaPass);

// ============ 鼠标交互 ============
const mouse = new THREE.Vector2(0, 0);
const mouseTarget = new THREE.Vector2(0, 0);
const mouse3D = new THREE.Vector3(0, 0, 0);

window.addEventListener('mousemove', (e) => {
  mouseTarget.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouseTarget.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

window.addEventListener('touchmove', (e) => {
  if (e.touches.length > 0) {
    mouseTarget.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
    mouseTarget.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
  }
}, { passive: true });

// ============ 中央发光核心 ============
const coreGeometry = new THREE.IcosahedronGeometry(1.2, 4);
const coreMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uMouse: { value: new THREE.Vector3(0, 0, 0) }
  },
  vertexShader: `
    uniform float uTime;
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying float vDisplacement;
    
    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
    vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
    
    float snoise(vec3 v) {
      const vec2 C = vec2(1.0/6.0, 1.0/3.0);
      const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
      vec3 i = floor(v + dot(v, C.yyy));
      vec3 x0 = v - i + dot(i, C.xxx);
      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min(g.xyz, l.zxy);
      vec3 i2 = max(g.xyz, l.zxy);
      vec3 x1 = x0 - i1 + C.xxx;
      vec3 x2 = x0 - i2 + C.yyy;
      vec3 x3 = x0 - D.yyy;
      i = mod289(i);
      vec4 p = permute(permute(permute(
        i.z + vec4(0.0, i1.z, i2.z, 1.0))
        + i.y + vec4(0.0, i1.y, i2.y, 1.0))
        + i.x + vec4(0.0, i1.x, i2.x, 1.0));
      float n_ = 0.142857142857;
      vec3 ns = n_ * D.wyz - D.xzx;
      vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
      vec4 x_ = floor(j * ns.z);
      vec4 y_ = floor(j - 7.0 * x_);
      vec4 x = x_ * ns.x + ns.yyyy;
      vec4 y = y_ * ns.x + ns.yyyy;
      vec4 h = 1.0 - abs(x) - abs(y);
      vec4 b0 = vec4(x.xy, y.xy);
      vec4 b1 = vec4(x.zw, y.zw);
      vec4 s0 = floor(b0) * 2.0 + 1.0;
      vec4 s1 = floor(b1) * 2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));
      vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
      vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
      vec3 p0 = vec3(a0.xy, h.x);
      vec3 p1 = vec3(a0.zw, h.y);
      vec3 p2 = vec3(a1.xy, h.z);
      vec3 p3 = vec3(a1.zw, h.w);
      vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
      p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
      vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
      m = m * m;
      return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
    }
    
    void main() {
      vNormal = normal;
      vPosition = position;
      float noise = snoise(normalize(position) * 2.5 + uTime * 0.4);
      float noise2 = snoise(normalize(position) * 5.0 + uTime * 0.2);
      float displacement = noise * 0.4 + noise2 * 0.2;
      vDisplacement = displacement;
      vec3 newPosition = position + normal * displacement * 0.5;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying float vDisplacement;
    
    void main() {
      vec3 viewDir = normalize(cameraPosition - vPosition);
      float fresnel = pow(1.0 - max(dot(viewDir, normalize(vNormal)), 0.0), 2.5);
      
      vec3 color1 = vec3(0.4, 0.6, 1.0);
      vec3 color2 = vec3(0.7, 0.5, 1.0);
      vec3 color3 = vec3(1.0, 0.8, 0.95);
      
      float mixFactor = vDisplacement * 0.5 + 0.5;
      vec3 baseColor = mix(color1, color2, mixFactor);
      baseColor = mix(baseColor, color3, fresnel * 0.8);
      
      float intensity = 1.0 + fresnel * 2.0;
      
      gl_FragColor = vec4(baseColor * intensity, 1.0);
    }
  `,
  transparent: true
});
const core = new THREE.Mesh(coreGeometry, coreMaterial);
scene.add(core);

// 核心光晕
const glowGeometry = new THREE.SphereGeometry(2.5, 64, 64);
const glowMaterial = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vPosition;
    void main() {
      vNormal = normal;
      vPosition = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec3 vNormal;
    varying vec3 vPosition;
    void main() {
      vec3 viewDir = normalize(cameraPosition - vPosition);
      float intensity = pow(0.7 - dot(vNormal, viewDir), 4.0);
      vec3 color = vec3(0.5, 0.6, 1.0) * 0.6 + vec3(0.8, 0.5, 1.0) * 0.4;
      gl_FragColor = vec4(color, intensity * 0.8);
    }
  `,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  transparent: true
});
const glow = new THREE.Mesh(glowGeometry, glowMaterial);
scene.add(glow);

// ============ 粒子系统 - 星尘 ============
const particleCount = 6000;
const positions = new Float32Array(particleCount * 3);
const colors = new Float32Array(particleCount * 3);
const sizes = new Float32Array(particleCount);
const speeds = new Float32Array(particleCount);
const offsets = new Float32Array(particleCount);

for (let i = 0; i < particleCount; i++) {
  const i3 = i * 3;
  const radius = 4 + Math.random() * 40;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  
  positions[i3] = radius * Math.sin(phi) * Math.cos(theta);
  positions[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
  positions[i3 + 2] = radius * Math.cos(phi);
  
  const colorChoice = Math.random();
  if (colorChoice < 0.4) {
    colors[i3] = 0.7; colors[i3 + 1] = 0.8; colors[i3 + 2] = 1.0;
  } else if (colorChoice < 0.7) {
    colors[i3] = 0.9; colors[i3 + 1] = 0.7; colors[i3 + 2] = 1.0;
  } else if (colorChoice < 0.9) {
    colors[i3] = 1.0; colors[i3 + 1] = 0.9; colors[i3 + 2] = 0.95;
  } else {
    colors[i3] = 1.0; colors[i3 + 1] = 1.0; colors[i3 + 2] = 1.0;
  }
  
  sizes[i] = Math.random() * 2 + 0.3;
  speeds[i] = Math.random() * 0.5 + 0.1;
  offsets[i] = Math.random() * Math.PI * 2;
}

const particlesGeometry = new THREE.BufferGeometry();
particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
particlesGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
particlesGeometry.setAttribute('speed', new THREE.BufferAttribute(speeds, 1));
particlesGeometry.setAttribute('offset', new THREE.BufferAttribute(offsets, 1));

const particlesMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
    uMouse: { value: new THREE.Vector3(0, 0, 0) }
  },
  vertexShader: `
    attribute float size;
    attribute float speed;
    attribute float offset;
    attribute vec3 color;
    
    uniform float uTime;
    uniform float uPixelRatio;
    uniform vec3 uMouse;
    
    varying vec3 vColor;
    varying float vAlpha;
    
    void main() {
      vColor = color;
      
      vec3 pos = position;
      
      float angle = uTime * speed * 0.1 + offset;
      float r = length(pos.xy);
      pos.x = pos.x + cos(angle) * 0.3 * speed;
      pos.y = pos.y + sin(angle * 1.3) * 0.3 * speed;
      pos.z = pos.z + sin(uTime * 0.5 + offset) * 0.2 * speed;
      
      vec3 dirToMouse = uMouse - pos;
      float distToMouse = length(dirToMouse);
      if (distToMouse < 5.0) {
        float force = (5.0 - distToMouse) * 0.15;
        pos -= normalize(dirToMouse) * force;
      }
      
      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mvPosition;
      
      float sizeMultiplier = (1.0 + sin(uTime * 2.0 + offset) * 0.3);
      gl_PointSize = size * sizeMultiplier * uPixelRatio * (300.0 / -mvPosition.z);
      
      vAlpha = 0.5 + sin(uTime + offset) * 0.3;
      vAlpha *= smoothstep(60.0, 20.0, -mvPosition.z);
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;
    
    void main() {
      vec2 center = gl_PointCoord - vec2(0.5);
      float dist = length(center);
      if (dist > 0.5) discard;
      
      float alpha = smoothstep(0.5, 0.0, dist) * vAlpha;
      alpha = pow(alpha, 1.5);
      
      gl_FragColor = vec4(vColor, alpha);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const particles = new THREE.Points(particlesGeometry, particlesMaterial);
scene.add(particles);

// ============ 环绕光环 ============
const ringCount = 5;
const rings = [];
for (let i = 0; i < ringCount; i++) {
  const ringRadius = 6 + i * 2.5;
  const ringGeometry = new THREE.TorusGeometry(ringRadius, 0.02 + Math.random() * 0.03, 16, 200);
  const hue = 0.6 + i * 0.08;
  const ringMaterial = new THREE.MeshBasicMaterial({
    color: new THREE.Color().setHSL(hue, 0.6, 0.7),
    transparent: true,
    opacity: 0.3 + Math.random() * 0.2,
    blending: THREE.AdditiveBlending
  });
  const ring = new THREE.Mesh(ringGeometry, ringMaterial);
  ring.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.8;
  ring.rotation.y = Math.random() * Math.PI;
  ring.rotation.z = Math.random() * Math.PI;
  ring.userData = {
    rotSpeedX: (Math.random() - 0.5) * 0.002,
    rotSpeedY: (Math.random() - 0.5) * 0.003,
    rotSpeedZ: (Math.random() - 0.5) * 0.001,
    baseRadius: ringRadius
  };
  scene.add(ring);
  rings.push(ring);
  
  // 环上的粒子点
  const dotCount = Math.floor(20 + i * 10);
  const dotPositions = new Float32Array(dotCount * 3);
  const dotSizes = new Float32Array(dotCount);
  const dotOffsets = new Float32Array(dotCount);
  
  for (let j = 0; j < dotCount; j++) {
    const angle = (j / dotCount) * Math.PI * 2;
    dotPositions[j * 3] = Math.cos(angle) * ringRadius;
    dotPositions[j * 3 + 1] = 0;
    dotPositions[j * 3 + 2] = Math.sin(angle) * ringRadius;
    dotSizes[j] = Math.random() * 3 + 1;
    dotOffsets[j] = Math.random() * Math.PI * 2;
  }
  
  const dotGeo = new THREE.BufferGeometry();
  dotGeo.setAttribute('position', new THREE.BufferAttribute(dotPositions, 3));
  dotGeo.setAttribute('size', new THREE.BufferAttribute(dotSizes, 1));
  dotGeo.setAttribute('offset', new THREE.BufferAttribute(dotOffsets, 1));
  
  const dotMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
      uColor: { value: new THREE.Color().setHSL(hue, 0.8, 0.8) }
    },
    vertexShader: `
      attribute float size;
      attribute float offset;
      uniform float uTime;
      uniform float uPixelRatio;
      varying float vAlpha;
      
      void main() {
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        
        float pulse = 0.7 + sin(uTime * 2.0 + offset) * 0.3;
        gl_PointSize = size * pulse * uPixelRatio * (300.0 / -mvPosition.z);
        vAlpha = 0.4 + sin(uTime * 1.5 + offset) * 0.4;
      }
    `,
    fragmentShader: `
      uniform vec3 uColor;
      varying float vAlpha;
      void main() {
        vec2 c = gl_PointCoord - 0.5;
        float d = length(c);
        if (d > 0.5) discard;
        float a = smoothstep(0.5, 0.0, d) * vAlpha;
        gl_FragColor = vec4(uColor, a);
      }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  
  const dots = new THREE.Points(dotGeo, dotMat);
  dots.rotation.copy(ring.rotation);
  dots.userData = { timeOffset: Math.random() * 100, ringRef: ring };
  scene.add(dots);
  rings.push(dots);
}

// ============ 背景星空 ============
const starCount = 2000;
const starPositions = new Float32Array(starCount * 3);
const starSizes = new Float32Array(starCount);

for (let i = 0; i < starCount; i++) {
  const radius = 100 + Math.random() * 400;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  
  starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
  starPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
  starPositions[i * 3 + 2] = radius * Math.cos(phi);
  starSizes[i] = Math.random() * 1.5 + 0.3;
}

const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
starGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));

const starMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
  },
  vertexShader: `
    attribute float size;
    uniform float uTime;
    uniform float uPixelRatio;
    varying float vAlpha;
    
    float random(vec3 pos) {
      return fract(sin(dot(pos, vec3(12.9898, 78.233, 45.543))) * 43758.5453);
    }
    
    void main() {
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mvPosition;
      float r = random(position);
      float twinkle = 0.6 + sin(uTime * (1.0 + r * 2.0) + r * 10.0) * 0.4;
      gl_PointSize = size * twinkle * uPixelRatio;
      vAlpha = 0.3 + twinkle * 0.5;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if (d > 0.5) discard;
      float a = smoothstep(0.5, 0.1, d) * vAlpha;
      gl_FragColor = vec4(1.0, 1.0, 1.0, a);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ============ 浮动几何图形 ============
const geoShapes = [];
const shapeGeometries = [
  new THREE.TetrahedronGeometry(0.8, 0),
  new THREE.OctahedronGeometry(0.6, 0),
  new THREE.IcosahedronGeometry(0.5, 0),
  new THREE.TorusGeometry(0.5, 0.12, 8, 16),
  new THREE.TorusKnotGeometry(0.4, 0.12, 32, 8)
];

for (let i = 0; i < 12; i++) {
  const geo = shapeGeometries[Math.floor(Math.random() * shapeGeometries.length)];
  const hue = 0.55 + Math.random() * 0.25;
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color().setHSL(hue, 0.7, 0.7),
    wireframe: true,
    transparent: true,
    opacity: 0.3 + Math.random() * 0.3,
    blending: THREE.AdditiveBlending
  });
  
  const mesh = new THREE.Mesh(geo, mat);
  
  const radius = 10 + Math.random() * 20;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  
  mesh.position.set(
    radius * Math.sin(phi) * Math.cos(theta),
    radius * Math.sin(phi) * Math.sin(theta),
    radius * Math.cos(phi)
  );
  
  mesh.userData = {
    rotSpeed: {
      x: (Math.random() - 0.5) * 0.02,
      y: (Math.random() - 0.5) * 0.02,
      z: (Math.random() - 0.5) * 0.02
    },
    floatSpeed: 0.3 + Math.random() * 0.5,
    floatOffset: Math.random() * Math.PI * 2,
    basePos: mesh.position.clone()
  };
  
  scene.add(mesh);
  geoShapes.push(mesh);
}

// ============ 光线 ============
const lightBeams = [];
for (let i = 0; i < 8; i++) {
  const beamGeometry = new THREE.PlaneGeometry(0.05, 30);
  const beamMaterial = new THREE.MeshBasicMaterial({
    color: new THREE.Color().setHSL(0.6 + i * 0.03, 0.6, 0.7),
    transparent: true,
    opacity: 0.08,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide
  });
  
  const beam = new THREE.Mesh(beamGeometry, beamMaterial);
  const angle = (i / 8) * Math.PI * 2;
  beam.position.set(Math.cos(angle) * 2, 0, Math.sin(angle) * 2);
  beam.rotation.y = angle + Math.PI / 2;
  beam.rotation.z = (Math.random() - 0.5) * 0.3;
  
  beam.userData = { angle, speed: 0.1 + Math.random() * 0.1 };
  scene.add(beam);
  lightBeams.push(beam);
}

// ============ 动画循环 ============
let time = 0;
let lastTime = performance.now();
let frameCount = 0;
let fpsTime = 0;
const particleEl = document.getElementById('particleCount');
const fpsEl = document.getElementById('fps');

// 粒子数动画
let displayCount = 0;
const targetCount = particleCount + starCount;
const countInterval = setInterval(() => {
  displayCount += Math.ceil((targetCount - displayCount) * 0.05);
  if (displayCount >= targetCount) {
    displayCount = targetCount;
    clearInterval(countInterval);
  }
  particleEl.textContent = displayCount.toLocaleString();
}, 30);

function animate() {
  requestAnimationFrame(animate);
  
  const currentTime = performance.now();
  const delta = (currentTime - lastTime) / 1000;
  lastTime = currentTime;
  time += delta;
  
  // FPS计算
  frameCount++;
  fpsTime += delta;
  if (fpsTime >= 0.5) {
    const fps = Math.round(frameCount / fpsTime);
    fpsEl.textContent = fps;
    frameCount = 0;
    fpsTime = 0;
  }
  
  // 鼠标平滑
  mouse.x += (mouseTarget.x - mouse.x) * 0.06;
  mouse.y += (mouseTarget.y - mouse.y) * 0.06;
  
  // 鼠标3D位置
  const vector = new THREE.Vector3(mouse.x, mouse.y, 0.5);
  vector.unproject(camera);
  const dir = vector.sub(camera.position).normalize();
  const distance = 15;
  mouse3D.copy(camera.position).add(dir.multiplyScalar(distance));
  
  // 相机缓动
  camera.position.x += (mouse.x * 4 - camera.position.x) * 0.03;
  camera.position.y += (mouse.y * 3 - camera.position.y) * 0.03;
  camera.lookAt(0, 0, 0);
  
  // 核心
  coreMaterial.uniforms.uTime.value = time;
  glowMaterial.uniforms.uTime.value = time;
  core.rotation.y += 0.003;
  core.rotation.x += 0.001;
  
  // 核心对鼠标的响应
  core.position.x = mouse3D.x * 0.1;
  core.position.y = mouse3D.y * 0.1;
  glow.position.copy(core.position);
  
  // 粒子
  particlesMaterial.uniforms.uTime.value = time;
  particlesMaterial.uniforms.uMouse.value = mouse3D;
  particles.rotation.y += 0.0005;
  particles.rotation.x += 0.0002;
  
  // 背景星
  starMat.uniforms.uTime.value = time;
  stars.rotation.y += 0.0001;
  
  // 环
  rings.forEach((ring, idx) => {
    if (ring.userData.rotSpeedX !== undefined) {
      ring.rotation.x += ring.userData.rotSpeedX;
      ring.rotation.y += ring.userData.rotSpeedY;
      ring.rotation.z += ring.userData.rotSpeedZ;
    } else if (ring.userData.ringRef) {
      ring.rotation.copy(ring.userData.ringRef.rotation);
      ring.material.uniforms.uTime.value = time + ring.userData.timeOffset;
    }
  });
  
  // 浮动几何体
  geoShapes.forEach((shape, i) => {
    shape.rotation.x += shape.userData.rotSpeed.x;
    shape.rotation.y += shape.userData.rotSpeed.y;
    shape.rotation.z += shape.userData.rotSpeed.z;
    
    const floatY = Math.sin(time * shape.userData.floatSpeed + shape.userData.floatOffset) * 0.5;
    const floatX = Math.cos(time * shape.userData.floatSpeed * 0.7 + shape.userData.floatOffset) * 0.3;
    shape.position.y = shape.userData.basePos.y + floatY;
    shape.position.x = shape.userData.basePos.x + floatX;
    
    // 鼠标排斥
    const dist = shape.position.distanceTo(mouse3D);
    if (dist < 6) {
      const force = (6 - dist) * 0.3;
      const dir = shape.position.clone().sub(mouse3D).normalize();
      shape.position.add(dir.multiplyScalar(force * delta * 10));
    }
  });
  
  // 光线
  lightBeams.forEach((beam, i) => {
    beam.userData.angle += beam.userData.speed * delta * 0.3;
    const r = 2 + Math.sin(time * 0.5 + i) * 0.5;
    beam.position.x = Math.cos(beam.userData.angle) * r;
    beam.position.z = Math.sin(beam.userData.angle) * r;
    beam.rotation.y = beam.userData.angle + Math.PI / 2;
    beam.material.opacity = 0.06 + Math.sin(time * 2 + i * 0.5) * 0.04;
  });
  
  // 辉光强度随时间变化
  bloomPass.strength = 0.8 + Math.sin(time * 0.3) * 0.2;
  
  composer.render();
}

animate();

// ============ 窗口调整 ============
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  fxaaPass.uniforms['resolution'].value.set(1 / window.innerWidth, 1 / window.innerHeight);
  particlesMaterial.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2);
  starMat.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2);
});
</script>
