<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('stage');

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x04030b, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05030f, 0.018);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, .1, 200);
camera.position.set(0, 1.2, 13);

const world = new THREE.Group();
scene.add(world);

/* ---------- GLSL noise (Ashima simplex) ---------- */
const SNOISE = /* glsl */`
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;

/* ---------- Background dome ---------- */
const dome = new THREE.Mesh(
  new THREE.SphereGeometry(90, 32, 32),
  new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false,
    uniforms:{ uTime:{value:0} },
    vertexShader:`varying vec3 vP; void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`
      varying vec3 vP; uniform float uTime;
      void main(){
        vec3 d=normalize(vP);
        float h=d.y*.5+.5;
        vec3 bottom=vec3(.012,.008,.035);
        vec3 top=vec3(.035,.02,.08);
        vec3 col=mix(bottom,top,h);
        float neb=pow(max(dot(d,normalize(vec3(-.6,.25,-.8))),0.0),6.0)*.10;
        col+=vec3(.35,.08,.3)*neb;
        neb=pow(max(dot(d,normalize(vec3(.7,-.1,-.6))),0.0),7.0)*.07;
        col+=vec3(.05,.3,.35)*neb;
        gl_FragColor=vec4(col,1.0);
      }`
  })
);
scene.add(dome);

/* ---------- Distant stars ---------- */
{
  const N=3500, p=new Float32Array(N*3), s=new Float32Array(N);
  for(let i=0;i<N;i++){
    const v=new THREE.Vector3().randomDirection().multiplyScalar(45+Math.random()*40);
    p.set([v.x,v.y,v.z],i*3); s[i]=Math.random();
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  g.setAttribute('aS',new THREE.BufferAttribute(s,1));
  const m=new THREE.PointsMaterial({
    size:.16,color:0xcfd8ff,transparent:true,opacity:.8,depthWrite:false,
    blending:THREE.AdditiveBlending,sizeAttenuation:true
  });
  const stars=new THREE.Points(g,m);
  stars.userData.base=m;
  scene.add(stars);
  scene.userData.stars=stars;
}

/* ---------- Nebula sprites ---------- */
function radialTexture(stops, size=256){
  const c=document.createElement('canvas');c.width=c.height=size;
  const x=c.getContext('2d');
  const grad=x.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  stops.forEach(([o,col])=>grad.addColorStop(o,col));
  x.fillStyle=grad;x.fillRect(0,0,size,size);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const nebulae=[];
[
  [0xe879f9,.5,-6,-14, 26],
  [0x22d3ee,.4, 8,  3,-18, 22],
  [0x6d5bff,.45,-9, 5,-22, 28],
  [0xffb066,.22, 4, -8,-10, 12]
].forEach(([c,o,x,y,z,sc])=>{
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({
    map:radialTexture([[0,`rgba(255,255,255,1)`],[.35,`rgba(255,255,255,.35)`],[1,`rgba(255,255,255,0)`]]),
    color:c,transparent:true,opacity:o,depthWrite:false,blending:THREE.AdditiveBlending
  }));
  sp.position.set(x,y,z);sp.scale.setScalar(sc);
  scene.add(sp);nebulae.push(sp);
});

/* ---------- Galaxy particles ---------- */
const GALAXY_N = 70000;
{
  const pos=new Float32Array(GALAXY_N*3);
  const col=new Float32Array(GALAXY_N*3);
  const sc=new Float32Array(GALAXY_N);
  const seed=new Float32Array(GALAXY_N);
  const cIn=new THREE.Color(0xffc46b), cMid=new THREE.Color(0xff77c8), cOut=new THREE.Color(0x5eead4), cEdge=new THREE.Color(0x8b7bff);
  for(let i=0;i<GALAXY_N;i++){
    const r=Math.pow(Math.random(),1.7)*6.2+0.25;
    const branch=i%3;
    const spin=r*1.35;
    const branchAngle=branch/3*Math.PI*2;
    const rx=Math.pow(Math.random(),3)*(Math.random()<.5?1:-1)*.55*(r*.28+.06);
    const ry=Math.pow(Math.random(),3)*(Math.random()<.5?1:-1)*.22*(r*.2+.04);
    const rz=Math.pow(Math.random(),3)*(Math.random()<.5?1:-1)*.55*(r*.28+.06);
    const a=branchAngle+spin;
    pos[i*3]  =Math.cos(a)*r+rx;
    pos[i*3+1]=ry;
    pos[i*3+2]=Math.sin(a)*r+rz;
    const t=r/6.4;
    const c=new THREE.Color();
    if(t<.35)c.copy(cIn).lerp(cMid,t/.35);
    else if(t<.75)c.copy(cMid).lerp(cOut,(t-.35)/.4);
    else c.copy(cOut).lerp(cEdge,(t-.75)/.25);
    col.set([c.r,c.g,c.b],i*3);
    sc[i]=.5+Math.random()*1.4;
    seed[i]=Math.random()*Math.PI*2;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aColor',new THREE.BufferAttribute(col,3));
  g.setAttribute('aScale',new THREE.BufferAttribute(sc,1));
  g.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
  const m=new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{
      uTime:{value:0},uSize:{value:26*renderer.getPixelRatio()},
      uPulse:{value:0}
    },
    vertexShader:`
      attribute vec3 aColor; attribute float aScale; attribute float aSeed;
      uniform float uTime,uSize,uPulse;
      varying vec3 vC; varying float vTw;
      void main(){
        vC=aColor;
        vec3 p=position;
        float r=length(p.xz)+0.001;
        float ang=atan(p.z,p.x)+uTime*(0.10/(r*0.4+0.35))+uPulse*0.15/(r+0.5);
        p.x=cos(ang)*r; p.z=sin(ang)*r;
        p.y+=sin(uTime*.6+aSeed)*0.035;
        p+=normalize(p+0.0001)*uPulse*0.6*(0.4+0.6*sin(r*2.5-aSeed));
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        gl_PointSize=uSize*aScale*(1.0/-mv.z);
        gl_Position=projectionMatrix*mv;
        vTw=.55+.45*sin(uTime*2.0+aSeed*3.0);
      }`,
    fragmentShader:`
      varying vec3 vC; varying float vTw;
      void main(){
        float d=distance(gl_PointCoord,vec2(.5));
        float a=smoothstep(.5,.08,d);
        a*=a;
        gl_FragColor=vec4(vC*(.7+vTw*.8),a*vTw);
      }`
  });
  const galaxy=new THREE.Points(g,m);
  galaxy.rotation.x=.32;
  world.add(galaxy);
  world.userData.galaxy=galaxy;
}

/* ---------- Central crystal ---------- */
const crystalUniforms={ uTime:{value:0}, uPulse:{value:0} };
const crystal=new THREE.Mesh(
  new THREE.IcosahedronGeometry(1.55, 48),
  new THREE.ShaderMaterial({
    uniforms:crystalUniforms,
    vertexShader:`
      ${SNOISE}
      uniform float uTime,uPulse;
      varying vec3 vN; varying vec3 vW; varying float vDisp; varying vec3 vLocal;
      void main(){
        float t=uTime*.28;
        float n=snoise(normal*1.4+t)+.5*snoise(normal*3.1-t*1.7);
        float disp=n*(.16+uPulse*.55)+uPulse*.25;
        vDisp=disp;
        vec3 p=position+normal*disp;
        vLocal=position;
        vN=normalize(normalMatrix*normal);
        vec4 wp=modelMatrix*vec4(p,1.0);
        vW=wp.xyz;
        gl_Position=projectionMatrix*viewMatrix*wp;
      }`,
    fragmentShader:`
      uniform float uTime,uPulse;
      varying vec3 vN; varying vec3 vW; varying float vDisp; varying vec3 vLocal;
      void main(){
        vec3 V=normalize(cameraPosition-vW);
        float fres=pow(1.0-max(dot(normalize(vN),V),0.0),2.6);
        float bands=sin(vDisp*9.0-uTime*1.6)+sin(vLocal.y*7.0+uTime);
        vec3 deep=vec3(.02,.10,.14);
        vec3 cyan=vec3(.20,.95,.82);
        vec3 mag=vec3(1.0,.35,.72);
        vec3 gold=vec3(1.0,.72,.32);
        vec3 base=mix(deep,cyan,fres*.9);
        base=mix(base,mag,smoothstep(.4,1.0,bands*.5+.5)*.45);
        base+=gold*smoothstep(.65,1.0,vDisp+uPulse)*.7;
        base+=cyan*fres*1.3;
        base+=fres*uPulse*1.6;
        gl_FragColor=vec4(base,1.0);
      }`
  })
);
world.add(crystal);

/* wire shell */
const shell=new THREE.Mesh(
  new THREE.IcosahedronGeometry(2.15,1),
  new THREE.MeshBasicMaterial({color:0x7df0e2,wireframe:true,transparent:true,opacity:.16,blending:THREE.AdditiveBlending,depthWrite:false})
);
world.add(shell);

const shell2=new THREE.Mesh(
  new THREE.OctahedronGeometry(2.7,0),
  new THREE.MeshBasicMaterial({color:0xff77c8,wireframe:true,transparent:true,opacity:.10,blending:THREE.AdditiveBlending,depthWrite:false})
);
world.add(shell2);

/* inner glowing core */
const core=new THREE.Mesh(
  new THREE.SphereGeometry(.62,32,32),
  new THREE.MeshBasicMaterial({color:0xffe6b0})
);
world.add(core);
const glow=new THREE.Sprite(new THREE.SpriteMaterial({
  map:radialTexture([[0,'rgba(255,230,180,1)'],[.3,'rgba(255,150,90,.55)'],[1,'rgba(255,120,60,0)']]),
  transparent:true,blending:THREE.AdditiveBlending,depthWrite:false
}));
glow.scale.setScalar(4.2);
world.add(glow);

/* ---------- Orbiting shards ---------- */
{
  const N=140;
  const geo=new THREE.ConeGeometry(.05,.34,4);
  geo.translate(0,.17,0);
  const mat=new THREE.MeshStandardMaterial({
    color:0x0b1420,emissive:0x5eead4,emissiveIntensity:1.4,
    metalness:.9,roughness:.25,transparent:true,opacity:.92
  });
  const inst=new THREE.InstancedMesh(geo,mat,N);
  const dummy=new THREE.Object3D();
  const data=[];
  for(let i=0;i<N;i++){
    const r=2.6+Math.random()*4.2;
    const a=Math.random()*Math.PI*2;
    const y=(Math.random()-.5)*2.2;
    data.push({r,a,y,speed:(.1+Math.random()*.25)*(Math.random()<.5?1:-1),spin:Math.random()*2,tilt:Math.random()*Math.PI});
  }
  inst.userData.data=data;inst.userData.dummy=dummy;
  world.add(inst);
  world.userData.shards=inst;

  const l1=new THREE.PointLight(0x7df0e2,30,30); world.add(l1); world.userData.l1=l1;
  const l2=new THREE.PointLight(0xff77c8,22,26); world.add(l2); world.userData.l2=l2;
  scene.add(new THREE.AmbientLight(0x223044,.7));
}

/* ---------- Burst particles ---------- */
const BURST_MAX=3000;
{
  const pos=new Float32Array(BURST_MAX*3);
  const vel=new Float32Array(BURST_MAX*3);
  const life=new Float32Array(BURST_MAX);
  const col=new Float32Array(BURST_MAX*3);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('aColor',new THREE.BufferAttribute(col,3).setUsage(THREE.DynamicDrawUsage));
  const m=new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{ uSize:{value:34*renderer.getPixelRatio()} },
    vertexShader:`
      attribute vec3 aColor; varying vec3 vC;
      uniform float uSize;
      void main(){
        vC=aColor;
        vec4 mv=modelViewMatrix*vec4(position,1.0);
        gl_PointSize=uSize*(1.0/-mv.z);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      varying vec3 vC;
      void main(){
        float d=distance(gl_PointCoord,vec2(.5));
        float a=pow(smoothstep(.5,.0,d),2.0);
        gl_FragColor=vec4(vC,a);
      }`
  });
  const points=new THREE.Points(g,m);
  world.add(points);
  world.userData.burst={points,pos,vel,life,col,next:0};
}

/* ---------- Shockwave rings ---------- */
const rings=[];
for(let i=0;i<5;i++){
  const m=new THREE.Mesh(
    new THREE.RingGeometry(.92,1.0,128),
    new THREE.MeshBasicMaterial({color:i%2?0xff77c8:0x7df0e2,transparent:true,opacity:0,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false})
  );
  m.visible=false; world.add(m); rings.push({m,age:1});
}

/* ---------- Post processing ---------- */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.15,.75,.12);
composer.addPass(bloom);

/* ---------- Interaction ---------- */
const pointer={x:0,y:0,tx:0,ty:0};
let rotV=0, dragging=false, moved=0, lastX=0,lastY=0;
let camZ=13, camTZ=13;
let pulse=0, shake=0;

addEventListener('pointermove',e=>{
  pointer.tx=(e.clientX/innerWidth)*2-1;
  pointer.ty=(e.clientY/innerHeight)*2-1;
  if(dragging){
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    rotV+=dx*.0032;
    world.rotation.x=THREE.MathUtils.clamp(world.rotation.x+dy*.0028,-1.1,1.1);
    moved+=Math.abs(dx)+Math.abs(dy);
    lastX=e.clientX;lastY=e.clientY;
  }
},{passive:true});

canvas.addEventListener('pointerdown',e=>{
  dragging=true;moved=0;lastX=e.clientX;lastY=e.clientY;
  canvas.classList.add('dragging');
});
addEventListener('pointerup',()=>{dragging=false;canvas.classList.remove('dragging');});
canvas.addEventListener('click',()=>{ if(moved<6) triggerPulse(); });
canvas.addEventListener('wheel',e=>{
  camTZ=THREE.MathUtils.clamp(camTZ+e.deltaY*.006,7,20);
},{passive:true});

function triggerPulse(){
  pulse=1;shake=.5;
  const b=world.userData.burst;
  const palette=[new THREE.Color(0xffc46b),new THREE.Color(0xff77c8),new THREE.Color(0x7df0e2)];
  for(let k=0;k<1400;k++){
    const i=b.next;b.next=(b.next+1)%BURST_MAX;
    const dir=new THREE.Vector3().randomDirection();
    const sp=2.5+Math.pow(Math.random(),1.8)*7;
    b.vel[i*3]=dir.x*sp;b.vel[i*3+1]=dir.y*sp;b.vel[i*3+2]=dir.z*sp;
    b.pos[i*3]=dir.x*.4;b.pos[i*3+1]=dir.y*.4;b.pos[i*3+2]=dir.z*.4;
    b.life[i]=1+Math.random()*.4;
    const c=palette[(Math.random()*palette.length)|0];
    b.col[i*3]=c.r;b.col[i*3+1]=c.g;b.col[i*3+2]=c.b;
  }
  const ring=rings.find(r=>r.age>=1);
  if(ring){ring.age=0;ring.m.visible=true;ring.m.quaternion.copy(camera.quaternion);}
}

document.getElementById('pulseBtn').addEventListener('click',triggerPulse);
document.getElementById('resetBtn').addEventListener('click',()=>{
  camTZ=13;rotV=0;world.rotation.set(0,0,0);
});

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});

/* ---------- Animate ---------- */
const clock=new THREE.Clock();
let intro=reduced?1:0;

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  const t=clock.elapsedTime*(reduced?.25:1);

  intro=Math.min(1,intro+dt*.55);
  const ease=1-Math.pow(1-intro,3);

  pointer.x+=(pointer.tx-pointer.x)*.045;
  pointer.y+=(pointer.ty-pointer.y)*.045;
  camZ+=(camTZ-camZ)*.08;

  pulse=Math.max(0,pulse-dt*1.15);
  shake=Math.max(0,shake-dt*1.4);

  if(!dragging) world.rotation.y+=rotV;
  rotV*=.94;

  world.userData.galaxy.material.uniforms.uTime.value=t;
  world.userData.galaxy.material.uniforms.uPulse.value=pulse;
  crystalUniforms.uTime.value=t;
  crystalUniforms.uPulse.value=pulse;
  dome.material.uniforms.uTime.value=t;

  crystal.rotation.y=t*.12;
  crystal.rotation.x=Math.sin(t*.15)*.12;
  shell.rotation.y=-t*.10;shell.rotation.x=t*.06;
  shell2.rotation.y=t*.16;shell2.rotation.z=t*.05;

  const breathe=1+Math.sin(t*1.4)*.05+pulse*.22;
  core.scale.setScalar(breathe);
  glow.scale.setScalar(4.2+Math.sin(t*1.4)*.25+pulse*1.4);
  glow.material.opacity=.75+pulse*.25;

  world.userData.l1.position.set(Math.cos(t*.7)*3,Math.sin(t*.5)*2,Math.sin(t*.7)*3);
  world.userData.l2.position.set(Math.cos(t*.5+2)*4,Math.cos(t*.6)*2.4,Math.sin(t*.5+2)*4);

  /* shards */
  const inst=world.userData.shards, d=inst.userData, dummy=d.dummy;
  for(let i=0;i<d.data.length;i++){
    const o=d.data[i];
    o.a+=dt*o.speed;
    dummy.position.set(Math.cos(o.a)*o.r,o.y+Math.sin(t*.6+i)*.15,Math.sin(o.a)*o.r);
    dummy.rotation.set(t*o.spin+o.tilt,o.a,t*.4);
    const s=.6+Math.sin(t*2+i)*.25+pulse*.5;
    dummy.scale.setScalar(s);
    dummy.updateMatrix();
    inst.setMatrixAt(i,dummy.matrix);
  }
  inst.instanceMatrix.needsUpdate=true;

  /* burst update */
  const b=world.userData.burst;
  for(let i=0;i<BURST_MAX;i++){
    if(b.life[i]>0){
      b.life[i]-=dt*.85;
      const drag=.982;
      b.vel[i*3]*=drag;b.vel[i*3+1]*=drag;b.vel[i*3+2]*=drag;
      b.pos[i*3]+=b.vel[i*3]*dt;
      b.pos[i*3+1]+=b.vel[i*3+1]*dt;
      b.pos[i*3+2]+=b.vel[i*3+2]*dt;
      const f=Math.max(b.life[i],0);
      b.col[i*3+6-2]*=1; // keep
      b.col[i*3]*=.995;b.col[i*3+1]*=.995;b.col[i*3+2]*=.995;
      if(b.life[i]<=0)b.pos[i*3]=b.pos[i*3+1]=b.pos[i*3+2]=9999;
    }
  }
  b.points.geometry.attributes.position.needsUpdate=true;
  b.points.geometry.attributes.aColor.needsUpdate=true;

  /* rings */
  rings.forEach(r=>{
    if(r.age<1){
      r.age+=dt*.9;
      const k=Math.min(r.age,1);
      const e=1-Math.pow(1-k,3);
      r.m.scale.setScalar(.5+e*9);
      r.m.material.opacity=(1-k)*.75;
      if(k>=1)r.m.visible=false;
    }
  });

  nebulae.forEach((s,i)=>{
    s.position.x+=Math.sin(t*.1+i)*.002;
    s.material.rotation=t*.01*(i%2?1:-1);
  });
  scene.userData.stars.rotation.y=t*.008;

  /* camera rig: intro dolly + parallax + shake */
  const sh=new THREE.Vector3((Math.random()-.5), (Math.random()-.5),0).multiplyScalar(shake*.25);
  camera.position.x = pointer.x*1.6*ease + sh.x;
  camera.position.y = 1.2 - pointer.y*1.0*ease + sh.y;
  camera.position.z = camZ + (1-ease)*10;
  camera.lookAt(0,0,0);

  bloom.strength=1.15+pulse*.55;

  composer.render();
}
animate();

setTimeout(()=>document.getElementById('loader').classList.add('done'),450);
</script>
