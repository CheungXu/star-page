<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>星页 StarPage · 一句话生成可分享的网页</title>
  <!-- 引入与生产环境 100% 相同的编译 CSS -->
  <link rel="stylesheet" href="prod.css" />
  <style>
    /* ==========================================================================
       只针对“有关文件的部分”进行精准升级（方案 5-A 优雅融合版）
       其它所有元素（侧边栏、标题、副标题、Chips、底部）100% 继承生产原版
       ========================================================================== */

    /* 卡片容器：保持原版 --radius-xl、阴影、渐变与流光边框，微调内部元素纵向节奏 */
    .prompt-card.hero-prompt.doc-focused-card {
      padding: 12px 14px 10px;
      gap: 6px;
    }

    /* --------------------------------------------------------------------------
       1. 上方文档专属主舱（高度更高，约 68px，与卡片浑然一体，绝不杂乱）
       -------------------------------------------------------------------------- */
    .doc-hero-chamber {
      position: relative;
      width: 100%;
      height: 68px;
      border-radius: var(--radius-md);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      box-sizing: border-box;
    }

    /* 空态：通透浅蓝渐变 + 柔和细虚线（与原版 composer-upload 按钮同源质感） */
    .doc-hero-chamber.is-empty {
      background: linear-gradient(180deg, rgba(238, 244, 255, 0.75) 0%, rgba(244, 248, 255, 0.45) 100%);
      border: 1px dashed rgba(53, 99, 233, 0.3);
      cursor: pointer;
    }

    .doc-hero-chamber.is-empty:hover {
      background: linear-gradient(180deg, rgba(234, 242, 255, 0.95) 0%, rgba(238, 246, 255, 0.75) 100%);
      border-color: rgba(53, 99, 233, 0.55);
      box-shadow: 0 2px 10px rgba(53, 99, 233, 0.08);
    }

    .doc-hero-chamber.is-dragover {
      background: rgba(224, 236, 255, 0.95) !important;
      border-color: var(--color-primary) !important;
      box-shadow: 0 0 0 3px rgba(53, 99, 233, 0.2) !important;
    }

    .chamber-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* 上传图标徽章：原版 Attachment 图标 + 浅蓝高光微盒 */
    .chamber-icon-box {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #eff5ff 0%, #dbe8fe 100%);
      border: 1px solid rgba(53, 99, 233, 0.2);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      box-shadow: 0 1px 3px rgba(53, 99, 233, 0.12);
      transition: transform 0.2s ease;
    }

    .doc-hero-chamber.is-empty:hover .chamber-icon-box {
      transform: translateY(-1px) scale(1.04);
    }

    .chamber-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: left;
    }

    .chamber-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--color-text-primary);
      letter-spacing: -0.01em;
    }

    .chamber-sub {
      font-size: 12px;
      color: var(--color-text-tertiary);
    }

    .chamber-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 优雅的原生风格操作胶囊 */
    .chamber-browse-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid rgba(53, 99, 233, 0.25);
      color: var(--color-primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      transition: all 0.15s ease;
    }

    .chamber-browse-btn:hover {
      background: var(--color-primary-soft);
      border-color: var(--color-primary);
    }

    /* --------------------------------------------------------------------------
       挂载态（已上传文档）：优雅呈现文件卡片，支持随时删除与直接生成
       -------------------------------------------------------------------------- */
    .doc-hero-chamber.is-loaded {
      height: auto;
      min-height: 54px;
      padding: 8px 12px;
      background: linear-gradient(180deg, rgba(240, 246, 255, 0.9) 0%, rgba(234, 242, 255, 0.65) 100%);
      border: 1px solid rgba(53, 99, 233, 0.25);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      cursor: default;
      gap: 8px;
      flex-wrap: wrap;
    }

    .loaded-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      flex-wrap: wrap;
    }

    .loaded-doc-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 8px;
      background: #ffffff;
      border: 1px solid rgba(53, 99, 233, 0.2);
      border-radius: var(--radius-sm);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--color-text-primary);
    }

    .loaded-doc-badge {
      font-size: 10px;
      font-weight: 800;
      color: #ffffff;
      padding: 2px 5px;
      border-radius: 4px;
      line-height: 1;
    }

    .loaded-doc-badge.excel { background: #16a34a; }
    .loaded-doc-badge.word { background: #2563eb; }
    .loaded-doc-badge.pdf { background: #dc2626; }
    .loaded-doc-badge.ppt { background: #ea580c; }

    .loaded-doc-size {
      font-size: 11px;
      font-weight: normal;
      color: var(--color-text-tertiary);
    }

    .loaded-doc-del {
      background: none;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      padding: 2px;
      display: inline-flex;
      border-radius: 4px;
      transition: all 0.15s ease;
    }

    .loaded-doc-del:hover {
      color: var(--color-danger);
      background: rgba(239, 68, 68, 0.1);
    }

    .loaded-add-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.8);
      border: 1px dashed rgba(53, 99, 233, 0.35);
      color: var(--color-primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .loaded-add-btn:hover {
      background: #ffffff;
      border-color: var(--color-primary);
    }

    /* --------------------------------------------------------------------------
       2. 下方输入框（高度更少，收敛精致，垂直基线绝对对齐）
       -------------------------------------------------------------------------- */
    .prompt-card textarea.doc-prompt-textarea {
      width: 100%;
      min-height: 38px;
      max-height: 140px;
      padding: 8px 4px 4px;
      font-size: 15px;
      line-height: 1.5;
      color: var(--color-text-primary);
      border: 0;
      background: transparent;
      outline: none;
      font-family: inherit;
      resize: none;
      box-sizing: border-box;
    }

    .prompt-card textarea.doc-prompt-textarea::placeholder {
      font-size: 14.5px;
      color: var(--color-text-muted);
    }

    /* --------------------------------------------------------------------------
       3. 底栏工具条：去掉左下角原上传小按钮（因已升格至顶部大舱），保持极度清爽
       -------------------------------------------------------------------------- */
    .prompt-card .composer-toolbar {
      padding: 2px 2px 2px;
      margin-top: 0;
      border-top: 0;
    }
  </style>
</head>

  <script>
    let attachedFiles = [];
    let isMenuOpen = false;

    function renderChamber() {
      const chamber = document.getElementById("docHeroChamber");
      const textarea = document.getElementById("promptTextarea");
      const sendBtn = document.getElementById("sendBtn");
      const hasText = textarea.value.trim().length > 0;
      const hasFiles = attachedFiles.length > 0;
      const canSubmit = hasFiles || hasText;

      // 只要有文件或有字，发送按钮立刻点亮
      if (canSubmit) {
        sendBtn.classList.remove("is-empty");
      } else {
        sendBtn.classList.add("is-empty");
      }

      if (hasFiles) {
        chamber.className = "doc-hero-chamber is-loaded";
        textarea.placeholder = "补充排版或风格要求（如：面向高管汇报，突出 Q3 利润率），选填";

        let chipsHtml = attachedFiles.map((f, idx) => `
          <div class="loaded-doc-chip">
            <span class="loaded-doc-badge ${f.type}">${f.typeLabel}</span>
            <span title="${f.name}">${f.name}</span>
            <span class="loaded-doc-size">${f.size}</span>
            <button type="button" class="loaded-doc-del" onclick="removeFile(event, ${idx})" title="移除">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        `).join("");

        if (attachedFiles.length < 3) {
          chipsHtml += `
            <button type="button" class="loaded-add-btn" onclick="triggerUpload(event)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              <span>继续添加</span>
            </button>
          `;
        }

        chamber.innerHTML = `
          <div class="loaded-row">
            ${chipsHtml}
          </div>
          <span style="font-size: 11.5px; color: var(--color-success); font-weight: 600; white-space: nowrap;">● 解析就绪</span>
        `;
      } else {
        chamber.className = "doc-hero-chamber is-empty";
        textarea.placeholder = "说说你想做的页面，例如「面向客户的产品介绍页」，或上传上方文档…";

        chamber.innerHTML = `
          <div class="chamber-left">
            <div class="chamber-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"></path>
              </svg>
            </div>
            <div class="chamber-text">
              <span class="chamber-title">上传或拖入文档转网页</span>
              <span class="chamber-sub">支持 Word · Excel · PDF · PPT（单文件 ≤ 50MB）</span>
            </div>
          </div>
          <div class="chamber-right">
            <button type="button" class="chamber-browse-btn" onclick="triggerUpload(event)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              <span>选择文档</span>
            </button>
          </div>
        `;
      }
    }

    function handleChamberClick() {
      if (attachedFiles.length === 0) {
        document.getElementById("realFileInput").click();
      }
    }

    function triggerUpload(e) {
      if (e) e.stopPropagation();
      document.getElementById("realFileInput").click();
    }

    function removeFile(e, idx) {
      e.stopPropagation();
      attachedFiles.splice(idx, 1);
      renderChamber();
    }

    function handleRealFile(files) {
      if (!files || files.length === 0) return;
      Array.from(files).forEach(f => {
        if (attachedFiles.length >= 3) return;
        let type = "word", typeLabel = "DOC";
        if (f.name.endsWith(".xlsx") || f.name.endsWith(".xls")) { type = "excel"; typeLabel = "XLS"; }
        else if (f.name.endsWith(".pdf")) { type = "pdf"; typeLabel = "PDF"; }
        else if (f.name.endsWith(".pptx")) { type = "ppt"; typeLabel = "PPT"; }
        attachedFiles.push({
          name: f.name,
          size: (f.size / (1024 * 1024)).toFixed(1) + " MB",
          type: type,
          typeLabel: typeLabel
        });
      });
      renderChamber();
    }

    function handleDragOver(e) {
      e.preventDefault();
      document.getElementById("docHeroChamber").classList.add("is-dragover");
    }

    function handleDragLeave(e) {
      e.preventDefault();
      document.getElementById("docHeroChamber").classList.remove("is-dragover");
    }

    function handleDrop(e) {
      e.preventDefault();
      document.getElementById("docHeroChamber").classList.remove("is-dragover");
      if (e.dataTransfer && e.dataTransfer.files) {
        handleRealFile(e.dataTransfer.files);
      }
    }

    function handleTextareaInput() {
      const textarea = document.getElementById("promptTextarea");
      textarea.style.height = "auto";
      textarea.style.height = Math.min(textarea.scrollHeight, 140) + "px";
      renderChamber();
    }

    function handleKeyDown(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleSubmit();
      }
    }

    function insertPreset(text) {
      const textarea = document.getElementById("promptTextarea");
      textarea.value = text;
      handleTextareaInput();
      textarea.focus();
    }

    function toggleSidebar() {
      const shell = document.getElementById("homeShell");
      const sidebar = document.getElementById("historySidebar");
      const isCollapsed = sidebar.classList.toggle("collapsed");
      shell.classList.toggle("sidebar-collapsed", isCollapsed);
    }

    function startNewChat() {
      attachedFiles = [];
      document.getElementById("promptTextarea").value = "";
      renderChamber();
    }

    function toggleFavorite(btn) {
      btn.classList.toggle("is-active");
    }

    function filterHistory(kw) {
      const items = document.querySelectorAll(".history-item");
      items.forEach(it => {
        const title = it.querySelector(".history-item-title").innerText;
        it.style.display = (!kw || title.includes(kw)) ? "flex" : "none";
      });
    }

    function toggleModelMenu(e) {
      e.stopPropagation();
      isMenuOpen = !isMenuOpen;
      const menu = document.getElementById("modelMenu");
      const wrap = document.getElementById("modelPickerWrap");
      menu.style.display = isMenuOpen ? "block" : "none";
      wrap.classList.toggle("is-open", isMenuOpen);
    }

    function toggleModelItem(btn) {
      btn.classList.toggle("is-active");
      const check = btn.querySelector(".model-menu-check");
      check.innerHTML = btn.classList.contains("is-active")
        ? `<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>`
        : "";
      const count = document.querySelectorAll(".model-menu-item.is-active").length;
      document.getElementById("modelPickerLabel").innerText = `${count} 个模型`;
    }

    document.addEventListener("click", () => {
      if (isMenuOpen) {
        isMenuOpen = false;
        document.getElementById("modelMenu").style.display = "none";
        document.getElementById("modelPickerWrap").classList.remove("is-open");
      }
    });

    function handleSubmit() {
      const prompt = document.getElementById("promptTextarea").value.trim();
      const hasFiles = attachedFiles.length > 0;
      if (!hasFiles && !prompt) return;

      const fileNames = hasFiles ? attachedFiles.map(f => f.name).join("、") : "（无文档）";
      alert(`[星页 StarPage 提交]\n\n【已挂载文档】：${fileNames}\n【补充指令】：${prompt || "（无额外指令，直接根据文档智能生成）"}`);
    }

    // 默认展示空态
    renderChamber();
  </script>
</body>
</html>
