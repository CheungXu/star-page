<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>星页 StarPage · 方案二：卡片内双逻辑带 (3002)</title>
  <link rel="stylesheet" href="_prod_base.css" />
  <link rel="stylesheet" href="preview-patch.css" />
  <style>
    /* ==========================================================================
       方案二特化：卡片内双逻辑带（显性两段式咬合）
       同一张卡片内，通过 1px 极微弱水平分割线，清晰界定“文档输入”与“微调指令”
       ========================================================================== */
    .tier-doc-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 6px 8px;
    }

    .tier-upload-trigger {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(234, 240, 255, 0.95), rgba(226, 234, 255, 0.85));
      border: 1px solid rgba(53, 99, 233, 0.32);
      color: var(--color-primary-active);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      transition: all 0.15s ease;
    }

    .tier-upload-trigger:hover {
      background: linear-gradient(180deg, #e3ecff, #d6e1ff);
      border-color: rgba(53, 99, 233, 0.5);
      transform: translateY(-1px);
    }

    .tier-doc-meta {
      font-size: 12px;
      color: var(--color-text-muted);
    }

    /* 文档挂载就绪态 */
    .tier-file-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(241, 245, 249, 0.85);
      border: 1px solid rgba(15, 23, 42, 0.1);
      padding: 4px 10px 4px 8px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--color-text-primary);
    }

    .tier-file-icon {
      font-size: 14px;
    }

    .tier-file-tag {
      font-size: 11px;
      color: var(--color-text-muted);
      font-weight: normal;
    }

    .tier-file-del {
      background: none;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      display: inline-flex;
      padding: 2px;
      border-radius: 4px;
    }

    .tier-file-del:hover {
      color: var(--color-danger);
    }

    .tier-divider {
      height: 1px;
      background: rgba(15, 23, 42, 0.07);
      margin: 2px 4px 6px;
    }

    .hero-prompt.is-two-tier textarea {
      padding-top: 6px;
      min-height: 52px;
    }
  </style>
</head>
<body>
  <div class="hero-aurora" aria-hidden="true">
    <span class="aurora-blob aurora-blob-1"></span>
    <span class="aurora-blob aurora-blob-2"></span>
    <span class="aurora-blob aurora-blob-3"></span>
    <span class="aurora-grid"></span>
  </div>

  <header class="preview-nav-bar">
    <div class="preview-nav-left">
      <img src="stars-page-logo-simple.png" width="22" height="22" alt="StarPage Logo" />
      <span>星页微调方案对比</span>
    </div>
    <nav class="preview-ports">
      <a href="http://localhost:3001/" class="preview-port-tab">3001 · 方案一：卡片内反转</a>
      <a href="http://localhost:3002/" class="preview-port-tab is-active">3002 · 方案二：双逻辑带</a>
      <a href="http://localhost:3003/" class="preview-port-tab">3003 · 方案三：常驻大胶囊</a>
      <a href="http://localhost:3004/" class="preview-port-tab">3004 · 方案四：分段切换</a>
      <a href="http://localhost:3005/" class="preview-port-tab">3005 · 方案五：自适应卡片</a>
    </nav>
  </header>

  <main class="page-shell">
    <div class="hero">
      <div class="brand-mark">
        <img
          src="stars-page-logo-simple.png"
          alt="星页 StarPage"
          class="brand-logo"
          width="58"
          height="58"
        />
      </div>

      <div class="preview-scheme-badge">
        <span class="dot"></span> 方案二：卡片内双逻辑带（显性两段式咬合）
      </div>

      <h1>想做什么页面？</h1>
      <p class="subtitle">
        文档提供事实内容，对话指定排版风格，<strong class="brand-inline">星页 StarPage</strong> 快速生成网页。
      </p>

      <div class="prompt-form-wrap hero-wrap">
        <form class="prompt-card hero-prompt is-two-tier" onsubmit="event.preventDefault(); handleSubmit();">
          <input type="file" id="fileInput" hidden multiple accept=".docx,.xlsx,.pptx,.pdf,.txt,.md" onchange="handleFile(this.files)" />

          <!-- 上段：文档主逻辑带 -->
          <div class="tier-doc-row" id="tierDocArea">
            <!-- 动态渲染空态或就绪态 -->
          </div>

          <!-- 轻量分割线 -->
          <div class="tier-divider" aria-hidden="true"></div>

          <!-- 下段：对话微调输入框 -->
          <textarea
            id="promptTextarea"
            placeholder="可选：补充风格倾向、业务侧重或受众需求…"
            rows="2"
          ></textarea>

          <!-- 底部工具栏 -->
          <div class="composer-toolbar">
            <div class="composer-tools">
              <div class="model-picker">
                <button type="button" class="model-picker-trigger">
                  <span class="model-picker-dots">
                    <span class="model-dot" style="background: #3b82f6;"></span>
                    <span class="model-dot" style="background: #10b981;"></span>
                  </span>
                  <span class="model-picker-text">2 个模型并行</span>
                  <span class="model-picker-caret">
                    <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                  </span>
                </button>
              </div>
            </div>

            <button
              class="composer-send"
              type="submit"
              id="sendButton"
              aria-label="创建页面"
            >
              <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
          </div>
        </form>

        <div class="prompt-inspirations" role="list">
          <span class="prompt-inspirations-lead">试试</span>
          <button type="button" class="prompt-inspiration-chip" onclick="insertPrompt('财务数据大屏：突出前三季度利润率与营收走势')">
            <span class="preset-emoji">📊</span>财务数据大屏
          </button>
          <button type="button" class="prompt-inspiration-chip" onclick="insertPrompt('战略规划白皮书：包含高管致辞、里程碑与组织架构')">
            <span class="preset-emoji">📑</span>战略规划白皮书
          </button>
          <button type="button" class="prompt-inspiration-chip" onclick="insertPrompt('个人履历在线化：单页沉浸式设计，支持一键联系')">
            <span class="preset-emoji">👤</span>个人履历在线化
          </button>
          <button type="button" class="prompt-inspiration-chip" onclick="insertPrompt('产品落地页：突出核心功能与对比表格')">
            <span class="preset-emoji">🚀</span>产品落地页
          </button>
        </div>
      </div>
    </div>
  </main>

  <aside class="preview-quick-toggle">
    <span>模拟状态：</span>
    <button class="preview-quick-btn" id="btnEmpty" onclick="simulateState('empty')">未选文档</button>
    <button class="preview-quick-btn is-active" id="btnLoaded" onclick="simulateState('loaded')">已选文档</button>
  </aside>

  <script>
    let currentDoc = { name: "2026年Q3经营分析报表.xlsx", size: "2.4 MB" };

    function renderTierDoc() {
      const area = document.getElementById("tierDocArea");
      if (currentDoc) {
        area.innerHTML = `
          <div class="tier-file-pill">
            <span class="tier-file-icon">📊</span>
            <span>${currentDoc.name}</span>
            <span class="tier-file-tag">(${currentDoc.size})</span>
            <button type="button" class="tier-file-del" onclick="removeDoc(event)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <span class="tier-doc-meta" style="color: var(--color-success); font-weight: 500;">✓ 内容事实已锚定</span>
        `;
      } else {
        area.innerHTML = `
          <button type="button" class="tier-upload-trigger" onclick="document.getElementById('fileInput').click()">
            <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"></path>
            </svg>
            上传核心文档
          </button>
          <span class="tier-doc-meta">支持 Word · Excel · PDF · PPT（单文件 ≤ 50MB）</span>
        `;
      }
    }

    function removeDoc(event) {
      event.stopPropagation();
      currentDoc = null;
      renderTierDoc();
      document.getElementById("btnEmpty").classList.add("is-active");
      document.getElementById("btnLoaded").classList.remove("is-active");
    }

    function handleFile(files) {
      if (files && files[0]) {
        currentDoc = {
          name: files[0].name,
          size: (files[0].size / (1024 * 1024)).toFixed(1) + " MB"
        };
        renderTierDoc();
        document.getElementById("btnLoaded").classList.add("is-active");
        document.getElementById("btnEmpty").classList.remove("is-active");
      }
    }

    function simulateState(state) {
      if (state === "empty") {
        currentDoc = null;
        document.getElementById("btnEmpty").classList.add("is-active");
        document.getElementById("btnLoaded").classList.remove("is-active");
      } else {
        currentDoc = { name: "2026年Q3经营分析报表.xlsx", size: "2.4 MB" };
        document.getElementById("btnLoaded").classList.add("is-active");
        document.getElementById("btnEmpty").classList.remove("is-active");
      }
      renderTierDoc();
    }

    function insertPrompt(val) {
      const textarea = document.getElementById("promptTextarea");
      textarea.value = val;
      textarea.focus();
    }

    function handleSubmit() {
      const prompt = document.getElementById("promptTextarea").value;
      const docName = currentDoc ? currentDoc.name : "（未上传文档）";
      alert(`[方案二演示]\n文档基座：${docName}\n指令微调：${prompt || "（自动优化布局）"}`);
    }

    renderTierDoc();
  </script>
</body>
</html>
