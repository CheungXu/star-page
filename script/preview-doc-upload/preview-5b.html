<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>星页 StarPage · 方案5-B：下置式全景挂载底条 (3002)</title>
  <link rel="stylesheet" href="_base5.css" />
  <style>
    /* ==========================================================================
       方案 5-B：下置式全景挂载底条（Bottom Panorama Dock）
       - Textarea 依旧在最顶层第一位，光标自然落定，直接敲字最丝滑
       - 在输入框下方构建一条超精致的全景挂载带，融合上传引导与已挂载状态
       ========================================================================== */

    .panorama-dock-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 8px;
      margin-top: 4px;
      margin-bottom: 6px;
      border-radius: var(--radius-md);
      transition: all 0.2s ease;
    }

    /* 空态：左侧有质感按钮 + 右侧超淡提示 */
    .panorama-dock-strip.is-empty {
      background: transparent;
    }

    .panorama-upload-cta {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(234, 240, 255, 0.95), rgba(226, 234, 255, 0.85));
      border: 1px solid rgba(53, 99, 233, 0.28);
      color: var(--color-primary-active);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      transition: all 0.16s ease;
    }

    .panorama-upload-cta:hover {
      background: linear-gradient(180deg, #e3ecff, #d6e1ff);
      border-color: rgba(53, 99, 233, 0.45);
      transform: translateY(-1px);
    }

    .panorama-upload-cta .icon {
      font-size: 14px;
      color: var(--color-primary);
      display: inline-flex;
    }

    .panorama-formats-badge {
      font-size: 11px;
      font-weight: normal;
      color: var(--color-text-tertiary);
      border-left: 1px solid rgba(53, 99, 233, 0.2);
      padding-left: 6px;
      margin-left: 2px;
    }

    .panorama-drag-hint {
      font-size: 12px;
      color: var(--color-text-muted);
    }

    /* 已挂载状态：卡片排布 */
    .panorama-dock-strip.is-loaded {
      background: rgba(241, 245, 249, 0.7);
      border: 1px solid var(--color-border);
    }

    .doc-pill-card {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 8px;
      border-radius: var(--radius-sm);
      background: #ffffff;
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: var(--shadow-sm);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--color-text-primary);
    }

    .doc-pill-card .pill-icon {
      font-size: 11px;
      font-weight: 800;
      color: #ffffff;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .doc-pill-card .pill-icon.excel { background: var(--color-doc-excel); }
    .doc-pill-card .pill-icon.word { background: var(--color-doc-word); }
    .doc-pill-card .pill-icon.pdf { background: var(--color-doc-pdf); }

    .doc-pill-card .pill-size {
      font-size: 11.5px;
      color: var(--color-text-tertiary);
      font-weight: normal;
    }

    .doc-pill-del {
      background: none;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      padding: 2px;
      display: inline-flex;
      border-radius: 4px;
    }

    .doc-pill-del:hover {
      color: var(--color-danger);
    }
  </style>
</head>
<body>
  <div class="hero-aurora" aria-hidden="true">
    <span class="aurora-blob aurora-blob-1"></span>
    <span class="aurora-blob aurora-blob-2"></span>
    <span class="aurora-blob aurora-blob-3"></span>
    <span class="aurora-grid"></span>
  </div>

  <header class="top-nav-switcher">
    <div class="nav-brand-group">
      <img src="stars-page-logo-simple.png" alt="StarPage Logo" />
      <span>自适应优化版</span>
    </div>
    <nav class="nav-tabs-group">
      <a href="http://localhost:3001/" class="nav-tab-pill">方案 5-A：顶部嵌入式呼吸槽 (:3001)</a>
      <a href="http://localhost:3002/" class="nav-tab-pill is-active">方案 5-B：下置式全景挂载底条 (:3002)</a>
      <a href="http://localhost:3003/" class="nav-tab-pill">方案 5-C：全域拖吸大平层 (:3003)</a>
    </nav>
  </header>

  <main class="page-shell">
    <div class="hero">
      <div class="brand-mark">
        <img
          src="stars-page-logo-simple.png"
          alt="星页 StarPage"
          class="brand-logo"
          width="58"
          height="58"
        />
      </div>

      <div class="scheme-tag">
        <span class="dot"></span> 方案 5-B：下置式全景挂载底条（Bottom Panorama Dock）
      </div>

      <h1>想做什么页面？</h1>
      <p class="subtitle">
        随时敲入灵感，或挂载文档作为内容基座，<strong class="brand-inline">星页 StarPage</strong> 帮你生成可对比的网页。
      </p>

      <div class="prompt-form-wrap hero-wrap">
        <form class="prompt-card hero-prompt" id="promptForm" onsubmit="event.preventDefault(); handleSubmit();">
          <input type="file" id="realFileInput" hidden multiple accept=".docx,.xlsx,.pptx,.pdf,.txt,.md" onchange="handleRealFile(this.files)" />

          <!-- 原汁原味置顶的 Textarea -->
          <textarea
            id="promptTextarea"
            placeholder="说说你想做的页面，例如「面向客户的产品介绍页」…"
            rows="2"
            oninput="handleTextareaInput()"
          ></textarea>

          <!-- 全景挂载底条 -->
          <div class="panorama-dock-strip is-empty" id="panoramaStrip">
            <div id="panoramaLeft">
              <button type="button" class="panorama-upload-cta" onclick="document.getElementById('realFileInput').click()">
                <span class="icon" aria-hidden="true">
                  <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"></path>
                  </svg>
                </span>
                <span>上传参考文档</span>
                <span class="panorama-formats-badge">Word · Excel · PDF</span>
              </button>
            </div>
            <div id="panoramaRight">
              <span class="panorama-drag-hint">支持直接拖入文件</span>
            </div>
          </div>

          <!-- 底部工具栏 -->
          <div class="composer-toolbar">
            <div class="composer-tools">
              <div class="model-picker">
                <button type="button" class="model-picker-trigger">
                  <span class="model-picker-dots">
                    <span class="model-dot" style="background: #3b82f6;"></span>
                    <span class="model-dot" style="background: #10b981;"></span>
                  </span>
                  <span class="model-picker-text">2 个模型并行</span>
                  <span class="model-picker-caret">
                    <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                      <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                  </span>
                </button>
              </div>
            </div>

            <button
              class="composer-send is-empty"
              type="submit"
              id="sendBtn"
              aria-label="创建页面"
            >
              <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
          </div>
        </form>

        <div class="prompt-inspirations" role="list">
          <span class="prompt-inspirations-lead">试试</span>
          <button type="button" class="prompt-inspiration-chip" onclick="insertPreset('Excel 数据看板：包含 KPI 大字与分类图表')">
            <span class="preset-emoji">📊</span>Excel 数据看板
          </button>
          <button type="button" class="prompt-inspiration-chip" onclick="insertPreset('Word 白皮书：结构化长篇阅读与侧边大纲')">
            <span class="preset-emoji">📑</span>Word 白皮书在线化
          </button>
          <button type="button" class="prompt-inspiration-chip" onclick="insertPreset('个人作品集主页，突出技术栈与商业成就')">
            <span class="preset-emoji">👤</span>个人作品集主页
          </button>
          <button type="button" class="prompt-inspiration-chip" onclick="insertPreset('高转化营销落地页')">
            <span class="preset-emoji">🚀</span>营销落地页
          </button>
        </div>
      </div>
    </div>
  </main>

  <aside class="quick-simulator">
    <span>体验模拟：</span>
    <button class="quick-sim-btn is-active" id="simEmpty" onclick="simulateDoc(false)">1. 空态（直接敲字）</button>
    <button class="quick-sim-btn" id="simLoaded" onclick="simulateDoc(true)">2. 上传文档（Q3财报.xlsx）</button>
  </aside>

  <script>
    let activeDoc = null;

    function updateUI() {
      const strip = document.getElementById("panoramaStrip");
      const textarea = document.getElementById("promptTextarea");
      const sendBtn = document.getElementById("sendBtn");
      const hasText = textarea.value.trim().length > 0;
      const canSubmit = Boolean(activeDoc) || hasText;

      if (canSubmit) {
        sendBtn.classList.remove("is-empty");
      } else {
        sendBtn.classList.add("is-empty");
      }

      if (activeDoc) {
        strip.className = "panorama-dock-strip is-loaded";
        document.getElementById("panoramaLeft").innerHTML = `
          <div class="doc-pill-card">
            <span class="pill-icon ${activeDoc.type}">${activeDoc.typeLabel}</span>
            <span>${activeDoc.name}</span>
            <span class="pill-size">(${activeDoc.size})</span>
            <button type="button" class="doc-pill-del" onclick="removeDoc(event)" title="移除">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        `;
        document.getElementById("panoramaRight").innerHTML = `
          <span style="font-size: 11.5px; color: var(--color-success); font-weight: 500;">● 内容事实已锚定</span>
        `;
        textarea.placeholder = "（可选）补充排版方向或风格偏好，不写将自动根据文档提炼生成…";
      } else {
        strip.className = "panorama-dock-strip is-empty";
        document.getElementById("panoramaLeft").innerHTML = `
          <button type="button" class="panorama-upload-cta" onclick="document.getElementById('realFileInput').click()">
            <span class="icon" aria-hidden="true">
              <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"></path>
              </svg>
            </span>
            <span>上传参考文档</span>
            <span class="panorama-formats-badge">Word · Excel · PDF</span>
          </button>
        `;
        document.getElementById("panoramaRight").innerHTML = `
          <span class="panorama-drag-hint">支持直接拖入文件</span>
        `;
        textarea.placeholder = "说说你想做的页面，例如「面向客户的产品介绍页」…";
      }
    }

    function removeDoc(e) {
      e.stopPropagation();
      activeDoc = null;
      document.getElementById("simEmpty").classList.add("is-active");
      document.getElementById("simLoaded").classList.remove("is-active");
      updateUI();
    }

    function handleTextareaInput() {
      updateUI();
    }

    function handleRealFile(files) {
      if (files && files[0]) {
        const f = files[0];
        let type = "word", typeLabel = "DOC";
        if (f.name.endsWith(".xlsx") || f.name.endsWith(".xls")) { type = "excel"; typeLabel = "XLS"; }
        else if (f.name.endsWith(".pdf")) { type = "pdf"; typeLabel = "PDF"; }
        activeDoc = {
          name: f.name,
          size: (f.size / (1024 * 1024)).toFixed(1) + " MB",
          type: type,
          typeLabel: typeLabel
        };
        document.getElementById("simLoaded").classList.add("is-active");
        document.getElementById("simEmpty").classList.remove("is-active");
        updateUI();
      }
    }

    function simulateDoc(loaded) {
      if (loaded) {
        activeDoc = { name: "2026年Q3经营分析报表.xlsx", size: "2.4 MB", type: "excel", typeLabel: "XLS" };
        document.getElementById("simLoaded").classList.add("is-active");
        document.getElementById("simEmpty").classList.remove("is-active");
      } else {
        activeDoc = null;
        document.getElementById("simEmpty").classList.add("is-active");
        document.getElementById("simLoaded").classList.remove("is-active");
      }
      updateUI();
    }

    function insertPreset(text) {
      const textarea = document.getElementById("promptTextarea");
      textarea.value = text;
      textarea.focus();
      updateUI();
    }

    function handleSubmit() {
      const prompt = document.getElementById("promptTextarea").value.trim();
      if (!activeDoc && !prompt) return;
      alert(`[方案 5-B 提交]\n文档：${activeDoc ? activeDoc.name : '（未上传文档）'}\n提示：${prompt || '（自动按文档生成）'}`);
    }

    simulateDoc(false);
  </script>
</body>
</html>
