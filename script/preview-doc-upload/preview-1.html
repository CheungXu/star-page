<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>星页 StarPage · 方案一：卡片内结构反转 (3001)</title>
  <link rel="stylesheet" href="_prod_base.css" />
  <link rel="stylesheet" href="preview-patch.css" />
  <style>
    /* ==========================================================================
       方案一特化：卡片内部结构反转（上文档条 + 下对话微调）
       保持当前 .prompt-card 尺寸、高光渐变与阴影，顶部新增超轻量文档吸附条
       ========================================================================== */
    .doc-dock-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      margin-bottom: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      user-select: none;
    }

    /* 空态：极为克制的浅灰虚线/浅底条 */
    .doc-dock-strip.is-empty {
      background: rgba(241, 245, 249, 0.6);
      border: 1px dashed rgba(53, 99, 233, 0.28);
      color: var(--color-text-secondary);
    }

    .doc-dock-strip.is-empty:hover {
      background: var(--color-primary-soft);
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .strip-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
    }

    .strip-icon {
      font-size: 15px;
      color: var(--color-primary);
      display: inline-flex;
    }

    .strip-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(53, 99, 233, 0.1);
      color: var(--color-primary);
    }

    .strip-hint {
      font-size: 11.5px;
      color: var(--color-text-muted);
    }

    /* 已挂载状态：文件药丸直接坐在顶部 */
    .doc-dock-strip.has-file {
      background: rgba(234, 240, 255, 0.7);
      border: 1px solid rgba(53, 99, 233, 0.22);
      cursor: default;
    }

    .strip-file-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-primary);
    }

    .strip-file-type {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1px 5px;
      border-radius: 4px;
      background: #16a34a;
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
    }

    .strip-file-size {
      font-size: 11.5px;
      font-weight: normal;
      color: var(--color-text-tertiary);
    }

    .strip-file-remove {
      background: none;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      padding: 3px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      transition: all 0.15s ease;
    }

    .strip-file-remove:hover {
      color: var(--color-danger);
      background: rgba(239, 68, 68, 0.1);
    }
  </style>
</head>
<body>
  <!-- 极光背景 -->
  <div class="hero-aurora" aria-hidden="true">
    <span class="aurora-blob aurora-blob-1"></span>
    <span class="aurora-blob aurora-blob-2"></span>
    <span class="aurora-blob aurora-blob-3"></span>
    <span class="aurora-grid"></span>
  </div>

  <!-- 顶部 5 方案快速切换导航 -->
  <header class="preview-nav-bar">
    <div class="preview-nav-left">
      <img src="stars-page-logo-simple.png" width="22" height="22" alt="StarPage Logo" />
      <span>星页微调方案对比</span>
    </div>
    <nav class="preview-ports">
      <a href="http://localhost:3001/" class="preview-port-tab is-active">3001 · 方案一：卡片内反转</a>
      <a href="http://localhost:3002/" class="preview-port-tab">3002 · 方案二：双逻辑带</a>
      <a href="http://localhost:3003/" class="preview-port-tab">3003 · 方案三：常驻大胶囊</a>
      <a href="http://localhost:3004/" class="preview-port-tab">3004 · 方案四：分段切换</a>
      <a href="http://localhost:3005/" class="preview-port-tab">3005 · 方案五：自适应卡片</a>
    </nav>
  </header>

  <main class="page-shell">
    <div class="hero">
      <div class="brand-mark">
        <img
          src="stars-page-logo-simple.png"
          alt="星页 StarPage"
          class="brand-logo"
          width="58"
          height="58"
        />
      </div>

      <div class="preview-scheme-badge">
        <span class="dot"></span> 方案一：卡片内结构反转（上文档条 + 下对话微调）
      </div>

      <h1>想做什么页面？</h1>
      <p class="subtitle">
        上传文档作为内容底座，<strong class="brand-inline">星页 StarPage</strong> 帮你生成可对比的网页。
      </p>

      <div class="prompt-form-wrap hero-wrap">
        <form class="prompt-card hero-prompt" onsubmit="event.preventDefault(); handleSubmit();">
          <input type="file" id="fileInput" hidden multiple accept=".docx,.xlsx,.pptx,.pdf,.txt,.md" onchange="handleFile(this.files)" />
          
          <!-- 顶部轻量文档吸附条 -->
          <div class="doc-dock-strip is-empty" id="docStrip" onclick="onStripClick()">
            <div class="strip-left">
              <span class="strip-icon" aria-hidden="true">
                <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" />
                </svg>
              </span>
              <span id="stripMainText">拖入或点击上传参考文档（Word / Excel / PDF / PPT）</span>
            </div>
            <div id="stripRightArea">
              <span class="strip-badge">内容基座</span>
            </div>
          </div>

          <!-- 需求微调输入框 -->
          <textarea
            id="promptTextarea"
            placeholder="补充排版或风格要求（如：面向高管汇报，突出 Q3 利润率），选填"
            rows="2"
          ></textarea>

          <!-- 底部工具栏：保持原汁原味 -->
          <div class="composer-toolbar">
            <div class="composer-tools">
              <div class="model-picker">
                <button type="button" class="model-picker-trigger">
                  <span class="model-picker-dots">
                    <span class="model-dot" style="background: #3b82f6;"></span>
                    <span class="model-dot" style="background: #10b981;"></span>
                  </span>
                  <span class="model-picker-text">2 个模型并行</span>
                  <span class="model-picker-caret">
                    <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                  </span>
                </button>
              </div>
            </div>

            <button
              class="composer-send"
              type="submit"
              id="sendButton"
              aria-label="创建页面"
            >
              <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
          </div>
        </form>

        <!-- 灵感建议 Chips -->
        <div class="prompt-inspirations" role="list">
          <span class="prompt-inspirations-lead">试试</span>
          <button type="button" class="prompt-inspiration-chip" onclick="insertPrompt('提取核心表格并转为互动可视化看板')">
            <span class="preset-emoji">📊</span>提取核心表格与看板
          </button>
          <button type="button" class="prompt-inspiration-chip" onclick="insertPrompt('双栏多章节白皮书排版，左侧带锚点目录')">
            <span class="preset-emoji">📑</span>双栏多章节白皮书
          </button>
          <button type="button" class="prompt-inspiration-chip" onclick="insertPrompt('提炼高管决策摘要，突出关键增长结论')">
            <span class="preset-emoji">🎯</span>提炼高管决策摘要
          </button>
          <button type="button" class="prompt-inspiration-chip" onclick="insertPrompt('采用暗黑极简科技风，注重手机端适配')">
            <span class="preset-emoji">🌙</span>暗黑极简科技风
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- 右下角快捷演示悬浮条 -->
  <aside class="preview-quick-toggle">
    <span>模拟状态：</span>
    <button class="preview-quick-btn" id="btnEmpty" onclick="simulateState('empty')">未选文档</button>
    <button class="preview-quick-btn is-active" id="btnLoaded" onclick="simulateState('loaded')">已选 Q3财报.xlsx</button>
  </aside>

  <script>
    let currentDoc = { name: "2026年Q3经营分析报表.xlsx", size: "2.4 MB", type: "XLS" };

    function renderStrip() {
      const strip = document.getElementById("docStrip");
      if (currentDoc) {
        strip.className = "doc-dock-strip has-file";
        document.getElementById("stripMainText").innerHTML = `
          <span class="strip-file-badge">
            <span class="strip-file-type">${currentDoc.type}</span>
            <span>${currentDoc.name}</span>
            <span class="strip-file-size">(${currentDoc.size})</span>
          </span>
        `;
        document.getElementById("stripRightArea").innerHTML = `
          <button type="button" class="strip-file-remove" onclick="removeDoc(event)" title="移除文档">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        `;
      } else {
        strip.className = "doc-dock-strip is-empty";
        document.getElementById("stripMainText").innerText = "拖入或点击上传参考文档（Word / Excel / PDF / PPT）";
        document.getElementById("stripRightArea").innerHTML = `<span class="strip-badge">内容基座</span>`;
      }
    }

    function onStripClick() {
      if (!currentDoc) {
        document.getElementById("fileInput").click();
      }
    }

    function removeDoc(event) {
      event.stopPropagation();
      currentDoc = null;
      renderStrip();
      document.getElementById("btnEmpty").classList.add("is-active");
      document.getElementById("btnLoaded").classList.remove("is-active");
    }

    function handleFile(files) {
      if (files && files[0]) {
        currentDoc = {
          name: files[0].name,
          size: (files[0].size / (1024 * 1024)).toFixed(1) + " MB",
          type: files[0].name.endsWith(".xlsx") ? "XLS" : files[0].name.endsWith(".pdf") ? "PDF" : "DOC"
        };
        renderStrip();
        document.getElementById("btnLoaded").classList.add("is-active");
        document.getElementById("btnEmpty").classList.remove("is-active");
      }
    }

    function simulateState(state) {
      if (state === "empty") {
        currentDoc = null;
        document.getElementById("btnEmpty").classList.add("is-active");
        document.getElementById("btnLoaded").classList.remove("is-active");
      } else {
        currentDoc = { name: "2026年Q3经营分析报表.xlsx", size: "2.4 MB", type: "XLS" };
        document.getElementById("btnLoaded").classList.add("is-active");
        document.getElementById("btnEmpty").classList.remove("is-active");
      }
      renderStrip();
    }

    function insertPrompt(val) {
      const textarea = document.getElementById("promptTextarea");
      textarea.value = val;
      textarea.focus();
    }

    function handleSubmit() {
      const prompt = document.getElementById("promptTextarea").value;
      const docName = currentDoc ? currentDoc.name : "（未上传文档）";
      alert(`[方案一演示]\n文档基座：${docName}\n微调诉求：${prompt || "（按默认版式自动优化生成）"}`);
    }

    renderStrip();
  </script>
</body>
</html>
