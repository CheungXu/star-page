<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>星页 StarPage · 方案5-C：全域拖吸大平层 (3003)</title>
  <link rel="stylesheet" href="_base5.css" />
  <style>
    /* ==========================================================================
       方案 5-C：全域拖吸大平层（Surface Drag & Auto-Morph）
       - 0 多余边框与槽位：空态完全回归当前原版最克制的大平层结构
       - 全卡片支持拖拽吸附，拖入时卡片边缘流光呼吸
       - 上传文档后，顶部平滑滑出磨砂玻璃文件锚定条，Textarea 自动降级为补充
       ========================================================================== */

    /* 顶部流体滑出条（Morphing Header） */
    .morphing-doc-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      margin-bottom: 8px;
      border-radius: var(--radius-md);
      background: linear-gradient(180deg, rgba(234, 240, 255, 0.9) 0%, rgba(226, 234, 255, 0.75) 100%);
      border: 1px solid rgba(53, 99, 233, 0.22);
      box-shadow: 0 1px 3px rgba(53, 99, 233, 0.08);
      animation: morphSlideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes morphSlideDown {
      from { opacity: 0; transform: translateY(-8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .morph-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-primary);
    }

    .morph-icon-badge {
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 800;
      color: #ffffff;
    }

    .morph-icon-badge.excel { background: var(--color-doc-excel); }
    .morph-icon-badge.word { background: var(--color-doc-word); }
    .morph-icon-badge.pdf { background: var(--color-doc-pdf); }

    .morph-sub {
      font-size: 11.5px;
      color: var(--color-text-tertiary);
      font-weight: normal;
    }

    .morph-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--color-success);
      font-weight: 600;
      margin-left: 6px;
    }

    .morph-status::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--color-success);
    }

    .morph-del-btn {
      background: none;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      padding: 3px;
      border-radius: 4px;
      display: inline-flex;
      transition: all 0.15s ease;
    }

    .morph-del-btn:hover {
      color: var(--color-danger);
    }

    /* 拖拽吸附高亮 */
    .prompt-card.is-drag-active {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 4px rgba(53, 99, 233, 0.18), 0 16px 36px -8px rgba(53, 99, 233, 0.25);
      transform: scale(1.008);
    }

    .prompt-card.is-drag-active::before {
      opacity: 1 !important;
      animation: composer-flow 1.5s ease-in-out infinite !important;
    }
  </style>
</head>
<body>
  <div class="hero-aurora" aria-hidden="true">
    <span class="aurora-blob aurora-blob-1"></span>
    <span class="aurora-blob aurora-blob-2"></span>
    <span class="aurora-blob aurora-blob-3"></span>
    <span class="aurora-grid"></span>
  </div>

  <header class="top-nav-switcher">
    <div class="nav-brand-group">
      <img src="stars-page-logo-simple.png" alt="StarPage Logo" />
      <span>自适应优化版</span>
    </div>
    <nav class="nav-tabs-group">
      <a href="http://localhost:3001/" class="nav-tab-pill">方案 5-A：顶部嵌入式呼吸槽 (:3001)</a>
      <a href="http://localhost:3002/" class="nav-tab-pill">方案 5-B：下置式全景挂载底条 (:3002)</a>
      <a href="http://localhost:3003/" class="nav-tab-pill is-active">方案 5-C：全域拖吸大平层 (:3003)</a>
    </nav>
  </header>

  <main class="page-shell">
    <div class="hero">
      <div class="brand-mark">
        <img
          src="stars-page-logo-simple.png"
          alt="星页 StarPage"
          class="brand-logo"
          width="58"
          height="58"
        />
      </div>

      <div class="scheme-tag">
        <span class="dot"></span> 方案 5-C：全域拖吸大平层（Surface Drag & Auto-Morph）
      </div>

      <h1>想做什么页面？</h1>
      <p class="subtitle">
        说说你的想法，或拖入文档作为内容底座，<strong class="brand-inline">星页 StarPage</strong> 帮你生成可对比的网页。
      </p>

      <div class="prompt-form-wrap hero-wrap">
        <form
          class="prompt-card hero-prompt"
          id="promptCard"
          onsubmit="event.preventDefault(); handleSubmit();"
          ondragover="handleDragOver(event)"
          ondragleave="handleDragLeave(event)"
          ondrop="handleDrop(event)"
        >
          <input type="file" id="realFileInput" hidden multiple accept=".docx,.xlsx,.pptx,.pdf,.txt,.md" onchange="handleRealFile(this.files)" />

          <!-- 上传后滑出的文档条（空态完全隐藏，零多余线条） -->
          <div class="morphing-doc-bar" id="morphBar">
            <div class="morph-left" id="morphLeft">
              <!-- 动态填充 -->
            </div>
            <div>
              <button type="button" class="morph-del-btn" onclick="removeDoc(event)" title="移除文档">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
          </div>

          <!-- 原版大平层 Textarea -->
          <textarea
            id="promptTextarea"
            placeholder="说说你想做的页面，或直接拖入 Word / Excel / PDF 文档（支持直接生成）…"
            rows="2"
            oninput="handleTextareaInput()"
          ></textarea>

          <!-- 底部工具栏 -->
          <div class="composer-toolbar">
            <div class="composer-tools">
              <!-- 精巧的原生上传入口 -->
              <label class="composer-upload" title="上传文档转网页" onclick="document.getElementById('realFileInput').click()">
                <span class="composer-upload-icon" aria-hidden="true">
                  <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"></path>
                  </svg>
                </span>
                <span class="composer-upload-text" id="uploadBtnLabel">上传文档</span>
              </label>

              <div class="model-picker">
                <button type="button" class="model-picker-trigger">
                  <span class="model-picker-dots">
                    <span class="model-dot" style="background: #3b82f6;"></span>
                    <span class="model-dot" style="background: #10b981;"></span>
                  </span>
                  <span class="model-picker-text">2 个模型并行</span>
                  <span class="model-picker-caret">
                    <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                      <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                  </span>
                </button>
              </div>
            </div>

            <button
              class="composer-send is-empty"
              type="submit"
              id="sendBtn"
              aria-label="创建页面"
            >
              <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
          </div>
        </form>

        <div class="prompt-inspirations" role="list">
          <span class="prompt-inspirations-lead">试试</span>
          <button type="button" class="prompt-inspiration-chip" onclick="insertPreset('Excel 数据大屏：提炼核心指标卡并自适应移动端')">
            <span class="preset-emoji">📊</span>Excel 数据大屏
          </button>
          <button type="button" class="prompt-inspiration-chip" onclick="insertPreset('Word 白皮书：优雅衬线排版与左侧目录锚点')">
            <span class="preset-emoji">📑</span>Word 交互白皮书
          </button>
          <button type="button" class="prompt-inspiration-chip" onclick="insertPreset('PDF 个人主页：突出工作经历与可交互项目演示')">
            <span class="preset-emoji">👤</span>PDF 个人主页
          </button>
          <button type="button" class="prompt-inspiration-chip" onclick="insertPreset('PPT 转单页产品发布秀')">
            <span class="preset-emoji">🚀</span>产品发布秀
          </button>
        </div>
      </div>
    </div>
  </main>

  <aside class="quick-simulator">
    <span>体验模拟：</span>
    <button class="quick-sim-btn is-active" id="simEmpty" onclick="simulateDoc(false)">1. 空态（直接敲字/拖入）</button>
    <button class="quick-sim-btn" id="simLoaded" onclick="simulateDoc(true)">2. 上传文档（Q3财报.xlsx）</button>
  </aside>

  <script>
    let activeDoc = null;

    function updateUI() {
      const morphBar = document.getElementById("morphBar");
      const textarea = document.getElementById("promptTextarea");
      const sendBtn = document.getElementById("sendBtn");
      const uploadBtnLabel = document.getElementById("uploadBtnLabel");
      const hasText = textarea.value.trim().length > 0;
      const canSubmit = Boolean(activeDoc) || hasText;

      if (canSubmit) {
        sendBtn.classList.remove("is-empty");
      } else {
        sendBtn.classList.add("is-empty");
      }

      if (activeDoc) {
        morphBar.style.display = "flex";
        document.getElementById("morphLeft").innerHTML = `
          <span class="morph-icon-badge ${activeDoc.type}">${activeDoc.typeLabel}</span>
          <span>${activeDoc.name}</span>
          <span class="morph-sub">(${activeDoc.size})</span>
          <span class="morph-status">已就绪</span>
        `;
        uploadBtnLabel.innerText = "更换文档";
        textarea.placeholder = "已关联文档。可直接生成，或在此输入补充指令（选填）…";
      } else {
        morphBar.style.display = "none";
        uploadBtnLabel.innerText = "上传文档";
        textarea.placeholder = "说说你想做的页面，或直接拖入 Word / Excel / PDF 文档（支持直接生成）…";
      }
    }

    function removeDoc(e) {
      e.stopPropagation();
      activeDoc = null;
      document.getElementById("simEmpty").classList.add("is-active");
      document.getElementById("simLoaded").classList.remove("is-active");
      updateUI();
    }

    function handleTextareaInput() {
      updateUI();
    }

    function handleRealFile(files) {
      if (files && files[0]) {
        attachFile(files[0]);
      }
    }

    function attachFile(f) {
      let type = "word", typeLabel = "DOC";
      if (f.name.endsWith(".xlsx") || f.name.endsWith(".xls")) { type = "excel"; typeLabel = "XLS"; }
      else if (f.name.endsWith(".pdf")) { type = "pdf"; typeLabel = "PDF"; }
      activeDoc = {
        name: f.name,
        size: (f.size / (1024 * 1024)).toFixed(1) + " MB",
        type: type,
        typeLabel: typeLabel
      };
      document.getElementById("simLoaded").classList.add("is-active");
      document.getElementById("simEmpty").classList.remove("is-active");
      updateUI();
    }

    function handleDragOver(e) {
      e.preventDefault();
      document.getElementById("promptCard").classList.add("is-drag-active");
    }

    function handleDragLeave(e) {
      e.preventDefault();
      document.getElementById("promptCard").classList.remove("is-drag-active");
    }

    function handleDrop(e) {
      e.preventDefault();
      document.getElementById("promptCard").classList.remove("is-drag-active");
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
        attachFile(e.dataTransfer.files[0]);
      }
    }

    function simulateDoc(loaded) {
      if (loaded) {
        activeDoc = { name: "2026年Q3经营分析报表.xlsx", size: "2.4 MB", type: "excel", typeLabel: "XLS" };
        document.getElementById("simLoaded").classList.add("is-active");
        document.getElementById("simEmpty").classList.remove("is-active");
      } else {
        activeDoc = null;
        document.getElementById("simEmpty").classList.add("is-active");
        document.getElementById("simLoaded").classList.remove("is-active");
      }
      updateUI();
    }

    function insertPreset(text) {
      const textarea = document.getElementById("promptTextarea");
      textarea.value = text;
      textarea.focus();
      updateUI();
    }

    function handleSubmit() {
      const prompt = document.getElementById("promptTextarea").value.trim();
      if (!activeDoc && !prompt) return;
      alert(`[方案 5-C 提交]\n内容基座：${activeDoc ? activeDoc.name : '（纯输入意图）'}\n补充指令：${prompt || '（一键直接生成）'}`);
    }

    simulateDoc(false);
  </script>
</body>
</html>
